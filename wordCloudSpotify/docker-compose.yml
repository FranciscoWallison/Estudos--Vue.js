networks:
  word-cloud:
    driver: bridge

services:
  app:
    build: app
    container_name: word-cloud-spotify-app
    restart: always
    tty: true
    networks:
      - word-cloud
    ports:
      - "3333:3333"
    volumes:
      - ./app:/usr/src/app
      - /usr/src/app/node_modules
    working_dir: /usr/src/app
    environment:
      - CHOKIDAR_USEPOLLING=true
